[project]
name = "ref-docker-base"
version = "0.1.0"
description = "Docker base image dependencies for REF"
requires-python = ">=3.12"
dependencies = [
    # Imported directly by task.py, the in-container submission script.
    "itsdangerous>=2.2.0",
    "requests>=2.34.2",

    # --- Toolbox installed for student use inside exercise containers. ---
    # Nothing in REF imports these; they exist so exercise and submission code
    # can. Treat the list as an interface students rely on: dropping an entry
    # can break an existing exercise, so unpin freely but remove deliberately.
    "cerberus>=1.3.8",
    "chardet>=7.7.0",
    "ipython>=9.18.1",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "oauthlib>=4.0.1",
    "opencv-python>=5.0.0.93",
    "pwntools>=4.15.0",
    "pyjwt>=2.15.1",
    "pylint>=4.1.3",
    "pyyaml>=6.0.3",
    "requests-unixsocket>=0.4.1",
    "tqdm>=4.70.1",

    # --- Legacy shims and transitive packages that an older dependency dump
    # left pinned here. Kept because an existing exercise may import them;
    # see .claude/plans for the open question about dropping them.
    "backcall>=0.2.0",
    "blinker>=1.9.0",
    "distro>=1.9.0",
    "importlib-resources>=7.1.0",
    "lazy-object-proxy>=1.13.0",
    "pathlib2>=2.3.7.post1",
    "pickleshare>=0.7.5",
    "tomli>=2.5.0",
    "wrapt>=2.5.2",
    "zipp>=4.1.2",
]

[tool.uv]
cache-dir = ".uv-cache"

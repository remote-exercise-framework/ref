name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.15.10"
  MYPY_VERSION: "2.4.1"
  # Match the spa-builder stage of frontend-proxy/Dockerfile, so the tests
  # and the shipped bundle are built by the same major.
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules (excluding ref-linux)
        run: |
          git submodule update --init ref-docker-base/ref-utils
          git submodule update --init webapp/ref/static/ace-builds

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Pin the linters. Installing them unpinned means a release that changes
      # the default rule set turns CI red on an unmodified codebase, which is
      # what ruff 0.16 did: it enabled many rule families that used to be
      # opt-in, taking this repo from zero findings to several hundred. Bump
      # these deliberately, together with whatever fixes the new rules demand.
      - name: Install linting tools
        run: |
          uv tool install 'ruff==${{ env.RUFF_VERSION }}'
          uv tool install 'mypy==${{ env.MYPY_VERSION }}'

      - name: Install test dependencies (for mypy)
        working-directory: tests
        run: uv sync

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run mypy
        working-directory: tests
        run: uv run mypy .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules (excluding ref-linux)
        run: |
          git submodule update --init ref-docker-base/ref-utils
          git submodule update --init webapp/ref/static/ace-builds

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Run unit tests
        working-directory: tests
        run: uv run pytest unit/ -v -m "not slow"

  spa-tests:
    name: SPA Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: spa-frontend/package-lock.json

      - name: Install SPA dependencies
        working-directory: spa-frontend
        run: npm ci

      - name: Type check
        working-directory: spa-frontend
        run: npm run typecheck

      - name: Run SPA unit tests
        working-directory: spa-frontend
        run: npm run test:coverage

      - name: Upload SPA coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spa-coverage-report
          path: spa-frontend/coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Each e2e module boots its own compose stack, and the SPA scoreboard
    # module builds an exercise image on top of that.
    timeout-minutes: 45
    env:
      # Must match the default in tests/e2e/conftest.py: a runner's
      # ~/.cache is writable, but keeping the browsers in the repo makes
      # the cache key and the test run agree on one path.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/.playwright-browsers
    steps:
      - uses: actions/checkout@v7

      - name: Initialize submodules (excluding ref-linux)
        run: |
          git submodule update --init ref-docker-base/ref-utils
          git submodule update --init webapp/ref/static/ace-builds

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies for prepare.py
        run: pip install jinja2 pyyaml

      - name: Generate configuration
        run: ./prepare.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker images
        run: |
          mkdir -p tests/build_logs
          export REF_CI_RUN=1
          ./ctrl.sh build 2>&1 | tee tests/build_logs/docker-build.log
          exit ${PIPESTATUS[0]}

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/uv.lock') }}

      # The browser binary is not on PyPI, so uv sync does not bring it.
      # Headless Chromium needs no display server, hence no xvfb.
      - name: Install Playwright Chromium
        working-directory: tests
        run: uv run playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests
        run: uv run pytest e2e/ -v --timeout=300

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: tests/coverage_reports/
          retention-days: 7

      - name: Generate failure log summary
        if: failure()
        working-directory: tests
        run: |
          if [ -d "failure_logs" ]; then
            uv run python summarize_logs.py || true
          fi

      - name: Upload failure logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-logs
          path: tests/failure_logs/
          retention-days: 7

      - name: Upload container logs on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: container-logs
          path: tests/container_logs/
          retention-days: 7

      - name: Upload build logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-logs
          path: tests/build_logs/
          retention-days: 7

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps -aq --filter "name=ref_test_" | xargs -r docker rm -f || true
          docker network ls -q --filter "name=ref_test_" | xargs -r docker network rm || true
          docker volume ls -q --filter "name=ref_test_" | xargs -r docker volume rm || true

[project]
name = "ref-tests"
version = "0.1.0"
description = "E2E test dependencies for REF"
requires-python = ">=3.12"
dependencies = [
    # --- Test runner. The plugins are loaded by pytest itself rather than
    # imported, so they look unused to static analysis but are required.
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-watch>=4.2.0",
    "pytest-xdist>=3.8.0",
    "coverage[toml]>=7.17.2",

    # --- Driving a running REF instance ---
    "cloudpickle>=3.1.2",
    "httpx>=0.28.1",
    "paramiko>=5.1.0",

    # --- Parsing admin HTML. lxml is not imported; it is the parser
    # beautifulsoup4 is asked for by name.
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",

    # --- Building exercise and submission fixtures ---
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",

    # The webapp itself, for its managers and models.
    "ref-webapp",
]

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
ref-webapp = { path = "../webapp", editable = true }

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportPrivateUsage = false
reportUnusedVariable = "warning"
reportMissingImports = false
reportUnknownLambdaType = false

[tool.coverage.run]
branch = true
source = ["helpers", "../webapp/ref"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/site-packages/*",
    "conftest.py",
    "test_*.py",
]

[tool.coverage.paths]
# Map container paths to host paths for combined coverage reporting.
# First path must exist on the reporting machine; others are patterns to remap.
# Paths are relative to tests/coverage_reports/ where coverage combine runs.
source = [
    "../../webapp/ref",
    "/app/ref",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true

[tool.coverage.html]
directory = "coverage_reports/htmlcov"

[tool.coverage.xml]
output = "coverage_reports/coverage.xml"

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disable_error_code = ["import-untyped", "no-any-return"]

[package]
name = "ssh-reverse-proxy"
version = "0.1.0"
edition = "2021"
description = "SSH proxy for Remote Exercise Framework"
authors = ["REF Team"]

[dependencies]
# SSH implementation (russh re-exports russh-keys as russh::keys)
russh = "0.65"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for API calls (use rustls for TLS, no OpenSSL dependency)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }

# Configuration
toml = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Crypto for request signing (itsdangerous compatible)
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.23"

# Zero-copy byte buffers, the payload type russh channel writes take
bytes = "1"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# Random number generation (kept on the major that russh depends on,
# so a single rand version is linked)
rand = "0.10"

# UUID generation for error tracking
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-test = "0.4"
